name: Test

on:
  pull_request:
  # Called by deploy.yml before it ships, so a push to main runs these checks exactly once
  # instead of once here and once there.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches the Dockerfile's node:22-alpine
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # the client bundle has to compile too
      # Browser tests, last: they run against the production build above, and the rest of the
      # suite has no DOM at all — which is how a whole screen once shipped having never been
      # rendered. CI needs its own Chromium; the dev container already has one.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
