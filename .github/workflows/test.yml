name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches the Dockerfile's node:22-alpine
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # the client bundle has to compile too
