<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Share-link stub. The server rewrites og:title/og:description/<title> per ?id= (dynamic
     social preview for crawlers). Real browsers are redirected into the app at /?id=.
     All values below are placeholders filled in by routes/challenge.js from site-config.js
     — edit there, not here. -->
<title>{{TITLE}}</title>
<link rel="icon" href="{{FAVICON}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{OG_SITE_NAME}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="{{OG_IMAGE_WIDTH}}">
<meta property="og:image:height" content="{{OG_IMAGE_HEIGHT}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="{{THEME_COLOR}}">
<script>location.replace("/" + (location.search || ""));</script>
</head>
<body></body>
</html>
