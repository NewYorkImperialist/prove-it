name: Deploy

# Ships to Fly.io. Runs automatically on every push to main, and can be run by hand from the
# Actions tab ("Run workflow") when you want to redeploy without a new commit.
#
# Setup, once: create a deploy token and store it as a repository secret named FLY_API_TOKEN
#   fly tokens create deploy          # copy the output, including the "FlyV1 " prefix
#   → GitHub → Settings → Secrets and variables → Actions → New repository secret
# (Note this is a *GitHub* secret, used to authenticate the deploy. The server's runtime cost
# guard needs the same token as a *Fly* secret as well — see the note in fly.toml.)
#
# Also needs a repository secret named OWNER_KEY, matching the OWNER_KEY already set as a Fly
# secret (the one that gates /admin) — run this in your own terminal, not through an assistant,
# since gh will read the value straight off your paste without it ever touching this workflow's
# logs or git history:
#   gh secret set OWNER_KEY --repo NewYorkImperialist/prove-it

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: a half-applied release is worse than a queue.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Same lint/test/build gate as a pull request gets — main is what's live, so it clears the bar
  # before anything ships.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Same banner the admin dashboard's own "1-min restart" button sends — gives anyone
      # mid-run a heads-up before the machine restarts out from under them. Best-effort: a
      # missing/wrong OWNER_KEY or a hiccup here shouldn't block the actual deploy.
      - name: Warn active players before the restart
        run: |
          curl -sf -G "https://proveit.fly.dev/admin/announce" \
            --data-urlencode "key=${{ secrets.OWNER_KEY }}" \
            --data-urlencode "msg=⚠️ Server updating in ~1 minute — finish your round!" \
          || echo "::warning::pre-deploy announcement failed (continuing anyway)"
      # --remote-only builds the image on Fly's builders, so this job needs no Docker setup.
      # CF_BEACON_TOKEN is optional: unset (as in any fork) simply ships no analytics beacon.
      # It's a --build-arg rather than an env var because Next inlines NEXT_PUBLIC_* while building.
      - run: flyctl deploy --remote-only --build-arg NEXT_PUBLIC_CF_BEACON_TOKEN="$CF_BEACON_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
